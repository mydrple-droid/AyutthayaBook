<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayutthaya Book - Content</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#fff8e8,#f6dfaa,#fff4d5);
    color:#4b2b13;
}

body{
    overflow-x:hidden;
}

.header{
    height:72px;
    background:rgba(255,255,255,.95);
    border-bottom:3px solid #d8aa55;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(80,45,10,.12);
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#52246f;
}

.logo span{
    margin-right:10px;
}

.home-btn{
    border:none;
    background:linear-gradient(135deg,#a52ac1,#7b1fa2);
    color:white;
    padding:12px 25px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(120,30,150,.25);
}

.main{
    width:100%;
    min-height:calc(100vh - 72px);
    padding:20px 20px 35px;
    display:flex;
    justify-content:center;
}

.book{
    width:min(1080px,96vw);
    background:linear-gradient(145deg,#fffdf4,#fff1c9);
    border:5px solid #c8933c;
    border-radius:25px;
    padding:12px;
    box-shadow:
        0 12px 30px rgba(80,45,10,.25),
        inset 0 0 0 3px #f4d28b;
}

.media-area{
    width:100%;
    height:min(52vw,480px);
    min-height:280px;
    border-radius:18px;
    overflow:hidden;
    border:4px solid #8f6224;
    background:#2c2115;
    position:relative;
    box-shadow:inset 0 0 20px rgba(0,0,0,.4);
}

.page-image,
.page-video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.page-video{
    background:#111;
}

.hidden{
    display:none !important;
}

.scene-badge{
    position:absolute;
    top:15px;
    left:15px;
    z-index:20;
    background:#efa72e;
    color:#3b210d;
    padding:10px 22px;
    border-radius:8px;
    font-weight:900;
    font-size:18px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.page-number{
    position:absolute;
    top:15px;
    right:15px;
    z-index:20;
    background:#fffdf5;
    color:#57216f;
    padding:10px 18px;
    border-radius:4px;
    font-weight:800;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.content-row{
    display:grid;
    grid-template-columns:1fr 175px;
    gap:14px;
    margin-top:14px;
}

.text-box{
    min-height:125px;
    background:linear-gradient(135deg,#fffdf4,#fff4d4);
    border:1px solid #e2bd70;
    border-radius:15px;
    padding:18px 24px;
    box-shadow:0 3px 10px rgba(130,85,20,.08);
}

.page-title{
    text-align:center;
    font-size:22px;
    font-weight:900;
    color:#76249e;
    margin-bottom:12px;
}

.karaoke{
    text-align:center;
    font-size:20px;
    line-height:1.8;
    font-weight:600;
}

.karaoke-word{
    display:inline-block;
    padding:2px 5px;
    margin:1px 2px;
    border-radius:7px;
    color:#4b2570;
    background:transparent;
    transition:.08s;
}

.karaoke-word.active{
    color:#fff !important;
    background:#ef6b17 !important;
    transform:scale(1.08);
    box-shadow:0 2px 8px rgba(239,107,23,.35);
}

.karaoke-word.done{
    color:#ef6b17 !important;
}

.audio-controls{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.audio-btn{
    border:none;
    border-radius:16px;
    min-height:70px;
    color:#fff;
    cursor:pointer;
    font-size:19px;
    font-weight:900;
    box-shadow:0 4px 9px rgba(0,0,0,.18);
}

.normal-btn{
    background:linear-gradient(135deg,#68c51e,#43a916);
}

.slow-btn{
    background:linear-gradient(135deg,#39a8e9,#147bc5);
}

.audio-btn small{
    display:block;
    font-size:13px;
    margin-top:2px;
}

.audio-btn.active{
    outline:4px solid rgba(255,196,0,.45);
}

.instruction{
    text-align:center;
    font-size:13px;
    color:#684e37;
    margin-top:8px;
}

.navigation{
    display:grid;
    grid-template-columns:125px 1fr 125px;
    align-items:center;
    gap:15px;
    margin-top:12px;
}

.nav-btn{
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#f4bd55,#dc951d);
    color:#512d0e;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 4px 8px rgba(110,70,15,.2);
}

.nav-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.dots{
    height:42px;
    background:#fff0cf;
    border:1px solid #dfb45b;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:0 10px;
    overflow:hidden;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#d9bc82;
    flex:none;
    cursor:pointer;
}

.dot.active{
    width:13px;
    height:13px;
    background:#ef6b17;
}

@media(max-width:800px){

    .header{
        padding:0 15px;
        height:62px;
    }

    .logo{
        font-size:15px;
    }

    .home-btn{
        padding:9px 16px;
    }

    .main{
        padding:10px;
    }

    .book{
        width:100%;
        border-width:3px;
        border-radius:18px;
    }

    .content-row{
        grid-template-columns:1fr;
    }

    .audio-controls{
        flex-direction:row;
    }

    .audio-btn{
        flex:1;
        min-height:60px;
    }

    .navigation{
        grid-template-columns:95px 1fr 95px;
    }

    .nav-btn{
        font-size:15px;
    }

    .karaoke{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <span>🏛️</span>
        Phra Nakhon Si Ayutthaya Travel Guide
    </div>

    <button class="home-btn" onclick="goHome()">
        🏠 หน้าหลัก
    </button>

</header>


<main class="main">

<div class="book">

    <div class="media-area">

        <div class="scene-badge" id="sceneBadge">

        </div>

        <div class="page-number" id="pageNumber">
            Page 1/25
        </div>

        <img

        >

        <video
            id="pageVideo"

            autoplay

            loop

    </div>


    <div class="content-row">

        <div class="text-box">

            <div id="pageTitle" class="page-title">
                About Phra Nakhon Si Ayutthaya.
            </div>

            <div id="karaokeText" class="karaoke"></div>

        </div>


        <div id="audioControls" class="audio-controls">

            <button
                class="audio-btn normal-btn"
                id="normalBtn"
                onclick="playAudio('normal')"
            >
                🔊 Normal
                <small>Speed</small>
            </button>

            <button
                class="audio-btn slow-btn"
                id="slowBtn"
                onclick="playAudio('slow')"
            >
                🐢 Slow
                <small>Speed</small>
            </button>

        </div>

    </div>


    <div id="instruction" class="instruction">
        🔊 เลือก Normal หรือ Slow เพื่อฟังเสียงและดู Karaoke
    </div>


    <div class="navigation">

        <button
            id="prevBtn"
            class="nav-btn"
            onclick="previousPage()"
        >
            ◀ Previous
        </button>

        <div id="dots" class="dots"></div>

        <button
            id="nextBtn"
            class="nav-btn"
            onclick="nextPage()"
        >
            Next ▶
        </button>

    </div>

</div>

</main>


<audio id="audioPlayer" preload="auto"></audio>

/* =========================================================
   VARIABLES
========================================================= */

let currentPage = 1;
let currentMode = null;

const audioPlayer = document.getElementById("audioPlayer");
const pageImage = document.getElementById("pageImage");
const pageVideo = document.getElementById("pageVideo");
const pageTitle = document.getElementById("pageTitle");
const karaokeText = document.getElementById("karaokeText");
const sceneBadge = document.getElementById("sceneBadge");
const pageNumber = document.getElementById("pageNumber");
const audioControls = document.getElementById("audioControls");
const instruction = document.getElementById("instruction");
const normalBtn = document.getElementById("normalBtn");
const slowBtn = document.getElementById("slowBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const dots = document.getElementById("dots");

let karaokeWords = [];
let karaokeTimer = null;


/* =========================================================
   KARAOKE
========================================================= */

function createKaraoke(text){

    karaokeText.innerHTML = "";
    karaokeWords = [];

    const words = text.trim().split(/\s+/);

    words.forEach((word,index)=>{

        const span = document.createElement("span");

        span.className = "karaoke-word";
        span.textContent = word;

        karaokeText.appendChild(span);

        karaokeWords.push(span);

        if(index < words.length-1){
            karaokeText.appendChild(
                document.createTextNode(" ")
            );
        }

    });
}


function resetKaraoke(){

    clearInterval(karaokeTimer);

    karaokeWords.forEach(word=>{
        word.classList.remove("active","done");
    });

}


function updateKaraoke(){

    if(!currentMode || !karaokeWords.length){
        return;
    }

    const duration = audioPlayer.duration;

    if(!duration || !Number.isFinite(duration)){
        return;
    }

    const currentTime = audioPlayer.currentTime || 0;

    let index =
        Math.floor(
            (currentTime / duration) * karaokeWords.length
        );

    if(index < 0){
        index = 0;
    }

    if(index >= karaokeWords.length){
        index = karaokeWords.length - 1;
    }

    karaokeWords.forEach((word,i)=>{

        word.classList.remove("active","done");

        if(i < index){
            word.classList.add("done");
        }

        if(i === index){
            word.classList.add("active");
        }

    });

}


/* =========================================================
   AUDIO
========================================================= */

function stopAudio(){

    clearInterval(karaokeTimer);

    audioPlayer.pause();

    audioPlayer.removeAttribute("src");

    audioPlayer.load();

    currentMode = null;

    normalBtn.classList.remove("active");
    slowBtn.classList.remove("active");

    resetKaraoke();
}


function playAudio(mode){

    const page = pages[currentPage - 1];

    if(!page || !page.audio){
        return;
    }

    if(
        currentMode === mode &&
        !audioPlayer.paused
    ){
        stopAudio();
        return;
    }

    stopAudio();

    currentMode = mode;

    const file =
        `audio/page${page.page}-${mode}.mp3`;

    if(mode === "normal"){

        normalBtn.classList.add("active");

    }else{

        slowBtn.classList.add("active");

    }

    audioPlayer.src = file;

    audioPlayer.volume = 1;

    audioPlayer.playbackRate =
        mode === "slow" ? 0.65 : 1;

    audioPlayer.load();

    audioPlayer.ontimeupdate =
        updateKaraoke;

    audioPlayer.onloadedmetadata =
        updateKaraoke;

    audioPlayer.onended = ()=>{

        clearInterval(karaokeTimer);

        karaokeWords.forEach(word=>{
            word.classList.remove("active");
            word.classList.add("done");
        });

        normalBtn.classList.remove("active");
        slowBtn.classList.remove("active");

        currentMode = null;

    };

    karaokeTimer =
        setInterval(updateKaraoke,40);

    audioPlayer.play()
        .then(()=>{
            updateKaraoke();
        })
        .catch(error=>{
            console.error(
                "ไม่สามารถเล่นเสียง:",
                file,
                error
            );
        });

}


/* =========================================================
   VIDEO
========================================================= */

function stopPageVideo(){

    pageVideo.pause();

    pageVideo.currentTime = 0;

    pageVideo.removeAttribute("src");

    pageVideo.load();

}


function loadVideo(page){

    pageVideo.pause();

    pageVideo.currentTime = 0;

    pageVideo.removeAttribute("src");

    pageVideo.load();

    pageVideo.classList.add("hidden");

    pageImage.classList.remove("hidden");

    /*
       สำคัญ:
       โฟลเดอร์จริงชื่อ video
       ไม่ใช่ videos
    */

    const videoFile =
        `video/page${page.page}.mp4`;

    pageVideo.poster = page.image;

    pageVideo.autoplay = true;
    pageVideo.loop = true;
    pageVideo.playsInline = true;
    pageVideo.preload = "auto";

    /*
       วิดีโอมีเสียงเบา 10%
    */

    pageVideo.muted = false;
    pageVideo.volume = 0.10;

    pageVideo.onloadeddata = ()=>{

        pageVideo.classList.remove("hidden");

        pageImage.classList.add("hidden");

        pageVideo.play()
            .catch(()=>{

                pageVideo.muted = true;

                pageVideo.play()
                    .catch(()=>{});

            });

    };

    pageVideo.onerror = ()=>{

        pageVideo.classList.add("hidden");

        pageImage.classList.remove("hidden");

    };

    pageVideo.src = videoFile;

    pageVideo.load();

}


/* =========================================================
   DOTS
========================================================= */

function createDots(){

    dots.innerHTML = "";

    pages.forEach((page,index)=>{

        const dot =
            document.createElement("span");

        dot.className = "dot";

        dot.title =
            `หน้า ${page.page}`;

        dot.onclick = ()=>{
            goToPage(index + 1);
        };

        dots.appendChild(dot);

    });

}


/* =========================================================
   LOAD PAGE
========================================================= */

function loadPage(pageNumberToLoad){

    stopAudio();

    stopPageVideo();

    currentPage =
        Math.max(
            1,
            Math.min(
                pages.length,
                pageNumberToLoad
            )
        );

    const page =
        pages[currentPage - 1];


    pageNumber.textContent =
        `Page ${currentPage}/25`;

    sceneBadge.textContent =
        `Scene ${currentPage}`;


    pageImage.src =
        page.image;

    pageImage.classList.remove("hidden");


    /*
       โหลดวิดีโอจากโฟลเดอร์ video
    */

    loadVideo(page);


    /*
       TITLE
    */

    pageTitle.textContent =
        page.title || "";

    pageTitle.style.display =
        page.title
        ? "block"
        : "none";


    /*
       KARAOKE
    */

    createKaraoke(page.text);


    /*
       AUDIO
    */

    if(page.audio){

        audioControls.style.display =
            "flex";

        instruction.textContent =
            "🔊 เลือก Normal หรือ Slow เพื่อฟังเสียงและดู Karaoke";

    }else{

        audioControls.style.display =
            "none";

        instruction.textContent =
            "📖 อ่านเนื้อเรื่องแล้วกด Next เพื่อไปหน้าถัดไป";

    }


    /*
       BUTTONS
    */

    prevBtn.disabled =
        currentPage === 1;

    nextBtn.disabled =
        currentPage === pages.length;


    /*
       DOTS
    */

    document
        .querySelectorAll(".dot")
        .forEach((dot,index)=>{

            dot.classList.toggle(
                "active",
                index === currentPage - 1
            );

        });


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   NEXT
========================================================= */

function nextPage(){

    if(currentPage < pages.length){

        loadPage(
            currentPage + 1
        );

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousPage(){

    if(currentPage > 1){

        loadPage(
            currentPage - 1
        );

    }

}


/* =========================================================
   GO TO PAGE
========================================================= */

function goToPage(page){

    loadPage(page);

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

    window.location.href = "index.html";

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowRight"){
            nextPage();
        }

        if(event.key === "ArrowLeft"){
            previousPage();
        }

        if(
            event.key === " " &&
            currentPage <= 16
        ){

            event.preventDefault();

            if(currentMode){

                playAudio(currentMode);

            }else{

                playAudio("normal");

            }

        }

    }
);


/* =========================================================
   START
========================================================= */

createDots();

loadPage(1);

</script>
