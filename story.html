<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayutthaya Book - Content</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:
        "Trebuchet MS",
        "Segoe UI",
        Arial,
        sans-serif;
    background:
        linear-gradient(135deg,#fff8e8,#f6dfaa,#fff4d5);
    color:#4b2b13;
}

body{
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    height:72px;
    background:rgba(255,255,255,.95);
    border-bottom:3px solid #d8aa55;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(80,45,10,.12);
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#52246f;
}

.logo span{
    margin-right:10px;
}

.home-btn{
    border:none;
    background:linear-gradient(135deg,#a52ac1,#7b1fa2);
    color:white;
    padding:12px 25px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(120,30,150,.25);
}

.home-btn:hover{
    transform:translateY(-1px);
}

/* =========================
   MAIN
========================= */

.main{
    width:100%;
    min-height:calc(100vh - 72px);
    padding:20px 20px 35px;
    display:flex;
    justify-content:center;
}

.book{
    width:min(1080px,96vw);
    background:
        linear-gradient(145deg,#fffdf4,#fff1c9);
    border:5px solid #c8933c;
    border-radius:25px;
    padding:12px;
    box-shadow:
        0 12px 30px rgba(80,45,10,.25),
        inset 0 0 0 3px #f4d28b;
    position:relative;
}

/* =========================
   TOP IMAGE / VIDEO
========================= */

.media-area{
    width:100%;
    height:min(52vw,480px);
    min-height:280px;
    border-radius:18px;
    overflow:hidden;
    border:4px solid #8f6224;
    background:#2c2115;
    position:relative;
    box-shadow:inset 0 0 20px rgba(0,0,0,.4);
}

.page-image,
.page-video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.page-video{
    background:#111;
}

/* hide image if video is used */
.hidden{
    display:none !important;
}

/* =========================
   PAGE BADGE
========================= */

.scene-badge{
    position:absolute;
    top:15px;
    left:15px;
    z-index:10;
    background:#efa72e;
    color:#3b210d;
    padding:10px 22px;
    border-radius:8px;
    font-weight:900;
    font-size:18px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.page-number{
    position:absolute;
    top:15px;
    right:15px;
    z-index:10;
    background:#fffdf5;
    color:#57216f;
    padding:10px 18px;
    border-radius:4px;
    font-weight:800;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}

/* =========================
   CONTENT + AUDIO
========================= */

.content-row{
    display:grid;
    grid-template-columns:1fr 175px;
    gap:14px;
    margin-top:14px;
}

.text-box{
    min-height:125px;
    background:
        linear-gradient(135deg,#fffdf4,#fff4d4);
    border:1px solid #e2bd70;
    border-radius:15px;
    padding:18px 24px;
    box-shadow:0 3px 10px rgba(130,85,20,.08);
}

/* title */
.page-title{
    text-align:center;
    font-size:22px;
    font-weight:900;
    color:#76249e;
    margin-bottom:12px;
}

/* =========================
   KARAOKE
========================= */

.karaoke{
    text-align:center;
    font-size:20px;
    line-height:1.8;
    font-weight:600;
}

.karaoke-word{
    display:inline-block;
    padding:1px 3px;
    margin:0 1px;
    border-radius:5px;
    transition:
        color .12s ease,
        background .12s ease,
        transform .12s ease,
        text-shadow .12s ease;
}

.karaoke-word.active{
    color:#e53935;
    background:#fff0a8;
    transform:scale(1.06);
    text-shadow:
        0 1px 0 #fff,
        0 0 7px rgba(255,180,0,.65);
}

.karaoke-word.done{
    color:#2476a8;
}

/* cover text */
.cover-text{
    font-size:24px;
    line-height:1.7;
    text-align:center;
    font-weight:700;
}

/* =========================
   AUDIO BUTTONS
========================= */

.audio-controls{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.audio-btn{
    border:none;
    border-radius:16px;
    min-height:70px;
    color:#fff;
    cursor:pointer;
    font-size:19px;
    font-weight:900;
    box-shadow:0 4px 9px rgba(0,0,0,.18);
    transition:.15s;
}

.audio-btn:hover{
    transform:translateY(-2px);
}

.audio-btn:active{
    transform:scale(.98);
}

.normal-btn{
    background:linear-gradient(135deg,#68c51e,#43a916);
}

.slow-btn{
    background:linear-gradient(135deg,#39a8e9,#147bc5);
}

.audio-btn small{
    display:block;
    font-size:13px;
    margin-top:2px;
}

.audio-btn.active{
    outline:4px solid rgba(255,196,0,.45);
}

/* =========================
   INSTRUCTION
========================= */

.instruction{
    text-align:center;
    font-size:13px;
    color:#684e37;
    margin-top:8px;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
    display:grid;
    grid-template-columns:125px 1fr 125px;
    align-items:center;
    gap:15px;
    margin-top:12px;
}

.nav-btn{
    height:52px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#f4bd55,#dc951d);
    color:#512d0e;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 4px 8px rgba(110,70,15,.2);
}

.nav-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.dots{
    height:42px;
    background:#fff0cf;
    border:1px solid #dfb45b;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:0 10px;
    overflow:hidden;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#d9bc82;
    flex:none;
    cursor:pointer;
}

.dot.active{
    width:13px;
    height:13px;
    background:#ef6b17;
}

/* =========================
   STORY PAGES 17-25
========================= */

.story-box{
    background:
        linear-gradient(135deg,#fffdf4,#fff2cd);
    border:1px solid #e2bd70;
    border-radius:15px;
    padding:28px;
    margin-top:14px;
    min-height:230px;
}

.story-title{
    text-align:center;
    color:#702394;
    font-size:27px;
    margin-bottom:18px;
}

.story-text{
    font-size:20px;
    line-height:1.9;
    text-align:justify;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .header{
        padding:0 15px;
        height:62px;
    }

    .logo{
        font-size:15px;
    }

    .home-btn{
        padding:9px 16px;
    }

    .main{
        padding:10px;
    }

    .book{
        width:100%;
        border-width:3px;
        border-radius:18px;
    }

    .content-row{
        grid-template-columns:1fr;
    }

    .audio-controls{
        flex-direction:row;
    }

    .audio-btn{
        flex:1;
        min-height:60px;
    }

    .navigation{
        grid-template-columns:95px 1fr 95px;
    }

    .nav-btn{
        font-size:15px;
    }

    .karaoke{
        font-size:17px;
    }

    .cover-text{
        font-size:19px;
    }
}
</style>
</head>

</main>

{

/* =========================================================
   VARIABLES
========================================================= */

let currentPage = 1;

let currentMode = null;

const audioPlayer =
    document.getElementById("audioPlayer");

let karaokeTimer = null;

let karaokeWords = [];

let karaokeIndex = -1;


/* =========================================================
   DOM
========================================================= */

const pageImage =
    document.getElementById("pageImage");

const pageVideo =
    document.getElementById("pageVideo");

const pageTitle =
    document.getElementById("pageTitle");

const karaokeText =
    document.getElementById("karaokeText");

const sceneBadge =
    document.getElementById("sceneBadge");

const pageNumber =
    document.getElementById("pageNumber");

const audioControls =
    document.getElementById("audioControls");

const instruction =
    document.getElementById("instruction");

const normalBtn =
    document.getElementById("normalBtn");

const slowBtn =
    document.getElementById("slowBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const dots =
    document.getElementById("dots");


/* =========================================================
   CREATE DOTS
========================================================= */

function createDots(){

    dots.innerHTML="";

    pages.forEach((page,index)=>{

        const dot =
            document.createElement("span");

        dot.className="dot";

        dot.title=`หน้า ${page.page}`;

        dot.onclick=()=>{
            goToPage(index+1);
        };

        dots.appendChild(dot);

    });

}


/* =========================================================
   STOP AUDIO
========================================================= */

function stopAudio(){

    clearInterval(karaokeTimer);

    karaokeTimer=null;

    audioPlayer.pause();

    audioPlayer.currentTime=0;

    audioPlayer.removeAttribute("src");

    audioPlayer.load();

    currentMode=null;

    karaokeIndex=-1;

    karaokeWords=[];

    document
        .querySelectorAll(".karaoke-word")
        .forEach(word=>{
            word.classList.remove("active","done");
        });

    normalBtn.classList.remove("active");

    slowBtn.classList.remove("active");
}


/* =========================================================
   KARAOKE WORDS
========================================================= */

function createKaraoke(text){

    karaokeText.innerHTML="";

    karaokeWords=[];

    const tokens =
        text.trim().split(/\s+/);

    tokens.forEach((token,index)=>{

        const span =
            document.createElement("span");

        span.className="karaoke-word";

        span.textContent=token;

        span.dataset.index=index;

        karaokeText.appendChild(span);

        karaokeWords.push(span);

        if(index < tokens.length-1){

            karaokeText.appendChild(
                document.createTextNode(" ")
            );

        }

    });

}


/* =========================================================
   KARAOKE SYNC
========================================================= */

/*
   ระบบนี้ใช้ความยาวจริงของ MP3
   แล้วแบ่งเวลาให้แต่ละคำตามจำนวนคำ

   เมื่อเสียงเริ่ม:
   คำจะถูกไฮไลต์ทีละคำ

   เมื่อเสียงจบ:
   คำสุดท้ายจะถูกไฮไลต์
*/

function startKaraoke(){

    clearInterval(karaokeTimer);

    if(!karaokeWords.length){
        return;
    }

    const duration =
        audioPlayer.duration;

    if(!duration || !isFinite(duration)){
        return;
    }

    const totalWords =
        karaokeWords.length;

    function update(){

        if(!audioPlayer.duration){
            return;
        }

        const progress =
            audioPlayer.currentTime /
            audioPlayer.duration;

        let index =
            Math.floor(progress * totalWords);

        if(index >= totalWords){
            index=totalWords-1;
        }

        if(index !== karaokeIndex){

            karaokeWords.forEach(
                (word,i)=>{

                    word.classList.remove(
                        "active",
                        "done"
                    );

                    if(i < index){
                        word.classList.add("done");
                    }

                }
            );

            karaokeWords[index]
                .classList.add("active");

            karaokeIndex=index;

            /*
              เลื่อนหน้าจอเบา ๆ
              ให้คำที่กำลังอ่านอยู่เห็นชัด
            */

            karaokeWords[index]
                .scrollIntoView({
                    behavior:"smooth",
                    block:"nearest",
                    inline:"nearest"
                });
        }

    }

    update();

    karaokeTimer =
        setInterval(update,80);
}


/* =========================================================
   PLAY AUDIO
========================================================= */

function playAudio(mode){

    const page =
        pages[currentPage-1];

    if(!page.audio){
        return;
    }

    /*
      กดปุ่มเดิมซ้ำ
      หยุดเสียง
    */

    if(
        currentMode === mode &&
        !audioPlayer.paused
    ){
        stopAudio();
        return;
    }

    stopAudio();

    currentMode=mode;

    const file =
        `audio/page${page.page}-${mode}.mp3`;

    audioPlayer.src=file;

    /*
      Normal = 1.0
      Slow = 0.65
    */

    audioPlayer.playbackRate =
        mode==="slow"
        ? 0.65
        : 1.0;

    if(mode==="normal"){
        normalBtn.classList.add("active");
    }else{
        slowBtn.classList.add("active");
    }

    audioPlayer.load();

    audioPlayer.onloadedmetadata=()=>{

        audioPlayer.play()
            .then(()=>{

                startKaraoke();

            })
            .catch(error=>{

                console.error(
                    "ไม่สามารถเล่นเสียง:",
                    file,
                    error
                );

            });

    };

    audioPlayer.onended=()=>{

        clearInterval(karaokeTimer);

        karaokeWords.forEach(
            word=>{
                word.classList.remove("active");
                word.classList.add("done");
            }
        );

        currentMode=null;

        normalBtn.classList.remove("active");
        slowBtn.classList.remove("active");

    };

}


/* =========================================================
   LOAD PAGE
========================================================= */

function loadPage(pageNumberToLoad){

    stopAudio();

    currentPage =
        Math.max(
            1,
            Math.min(
                pages.length,
                pageNumberToLoad
            )
        );

    const page =
        pages[currentPage-1];


    /* ======================
       PAGE NUMBER
    ====================== */

    pageNumber.textContent =
        `Page ${currentPage}/25`;

    sceneBadge.textContent =
        `Scene ${currentPage}`;


    /* ======================
       IMAGE
    ====================== */

    pageImage.src =
        page.image;

    pageImage.classList.remove("hidden");


    /* ======================
       VIDEO
       ใช้ videos/page1.mp4 ... videos/page25.mp4
       ถ้าไม่มีไฟล์ ให้แสดงรูปแทน
    ====================== */

    pageVideo.pause();
    pageVideo.removeAttribute("src");
    pageVideo.load();
    pageVideo.classList.add("hidden");

    const videoFile = `videos/page${page.page}.mp4`;
    pageVideo.poster = page.image;
    pageVideo.loop = true;
    pageVideo.playsInline = true;
    pageVideo.autoplay = true;
    pageVideo.volume = 0.12; // เสียงวิดีโอเบา 12%

    // แสดงวิดีโอเมื่อไฟล์โหลดได้
    pageVideo.onloadeddata = () => {
        pageVideo.classList.remove("hidden");
        pageImage.classList.add("hidden");

        // พยายามเล่นอัตโนมัติด้วยเสียงเบา
        pageVideo.muted = false;
        pageVideo.volume = 0.12;

        pageVideo.play().catch(() => {
            // Browser บางตัวบล็อก autoplay ที่มีเสียง
            // จึง fallback เป็น muted autoplay เพื่อให้วิดีโอเล่นวนได้ทันที
            pageVideo.muted = true;
            pageVideo.volume = 0.12;
            pageVideo.play().catch(() => {});
        });
    };

    // ถ้าไม่มีวิดีโอ ให้กลับมาแสดงรูป
    pageVideo.onerror = () => {
        pageVideo.pause();
        pageVideo.removeAttribute("src");
        pageVideo.load();
        pageVideo.classList.add("hidden");
        pageImage.classList.remove("hidden");
    };

    pageVideo.src = videoFile;
    pageVideo.load();


    /* ======================
       TITLE
    ====================== */

    pageTitle.textContent =
        page.title || "";

    pageTitle.style.display =
        page.title
        ? "block"
        : "none";


    /* ======================
       KARAOKE TEXT
    ====================== */

    createKaraoke(page.text);


    /* ======================
       AUDIO
    ====================== */

    if(page.audio){

        audioControls.style.display="flex";

        instruction.textContent =
            "🔊 เลือก Normal หรือ Slow เพื่อฟังเสียงและดู Karaoke";

    }else{

        audioControls.style.display="none";

        instruction.textContent =
            "📖 อ่านเนื้อเรื่องแล้วกด Next เพื่อไปหน้าถัดไป";

    }


    /* ======================
       BUTTONS
    ====================== */

    prevBtn.disabled =
        currentPage===1;

    nextBtn.disabled =
        currentPage===pages.length;


    /* ======================
       DOTS
    ====================== */

    const allDots =
        document.querySelectorAll(".dot");

    allDots.forEach(
        (dot,index)=>{
            dot.classList.toggle(
                "active",
                index===currentPage-1
            );
        }
    );


    /* ======================
       TOP
    ====================== */

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   NEXT
========================================================= */

function nextPage(){

    if(currentPage < pages.length){

        stopAudio();

        loadPage(
            currentPage+1
        );

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousPage(){

    if(currentPage > 1){

        stopAudio();

        loadPage(
            currentPage-1
        );

    }

}


/* =========================================================
   GO TO PAGE
========================================================= */

function goToPage(page){

    stopAudio();

    loadPage(page);

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

    stopAudio();

    // กลับหน้าแรกแบบ absolute path ป้องกัน /index.html
    window.location.replace("/index.html");

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key==="ArrowRight"){
            nextPage();
        }

        if(event.key==="ArrowLeft"){
            previousPage();
        }

        if(event.key===" " &&
           currentPage<=16){

            event.preventDefault();

            if(currentMode){
                playAudio(currentMode);
            }else{
                playAudio("normal");
            }

        }

    }
);


window.addEventListener("beforeunload", () => {
    stopAudio();
    if(pageVideo){
        pageVideo.pause();
        pageVideo.removeAttribute("src");
        pageVideo.load();
    }
});

/* =========================================================
   START
========================================================= */

createDots();

loadPage(1);

</script>
